<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>titlebar-poc</title>
<style>
  :root {
    --tb-top: 0px; --tb-h: 32px; --tb-right: 138px;
    --tb-bg: #f3f3f3; --tb-fg: #1b1b1f; --tb-muted: #6b6b73; --tb-hover: rgb(0 0 0 / .06);
    --bg: #fafafa; --card: #ffffff; --fg: #1b1b1f; --muted: #6b6b73; --line: rgb(0 0 0 / .08);
    --accent: #3b5bdb;
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); }

  .titlebar {
    box-sizing: content-box; /* keep the 1px separator below the caption-button hole */
    height: var(--tb-h); flex: none; display: flex; align-items: center; gap: 2px;
    padding: var(--tb-top) var(--tb-right) 0 10px;
    background: var(--tb-bg); color: var(--tb-fg);
    border-bottom: 1px solid var(--line);
    app-region: drag; user-select: none;
    transition: color .15s;
  }
  body.inactive .titlebar { color: var(--tb-muted); }
  .titlebar :is(button, input) { app-region: no-drag; }
  .brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; font-weight: 600; }
  .brand svg { width: 16px; height: 16px; color: var(--accent); }
  .tb-btn {
    height: 24px; padding: 0 9px; border: 0; border-radius: 5px;
    background: transparent; color: inherit; font: inherit;
  }
  .tb-btn:hover { background: var(--tb-hover); }
  .search {
    margin: 0 auto; width: min(360px, 40%); height: 24px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 6px; outline: none;
    background: var(--tb-hover); color: inherit; font: inherit;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--tb-muted); }

  main { flex: 1; overflow: auto; padding: 24px; display: grid; gap: 16px; align-content: start;
         grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; }
  .muted { color: var(--muted); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px;
    border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit;
  }
  .swatch i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgb(0 0 0 / .12); }
  .swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #log { margin: 0; font: 12px/1.5 "Cascadia Mono", Consolas, monospace; color: var(--muted); max-height: 220px; overflow: auto; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: "Cascadia Mono", Consolas, monospace; }
</style>
</head>
<body>
  <header class="titlebar" id="titlebar">
    <div class="brand" id="brand">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5" opacity=".55"/><rect x="1" y="9" width="6" height="6" rx="1.5" opacity=".55"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
      Workbench
    </div>
    <button class="tb-btn" id="menu-file">File</button>
    <button class="tb-btn" id="menu-edit">Edit</button>
    <button class="tb-btn" id="menu-view">View</button>
    <input class="search" id="search" placeholder="Search or run a command" />
  </header>
  <main>
    <section class="card">
      <h2>Title bar theme</h2>
      <div class="swatches" id="themes"></div>
    </section>
    <section class="card">
      <h2>Window</h2>
      <dl>
        <dt>Insets</dt><dd id="insets">-</dd>
        <dt>Scale</dt><dd id="dpr">-</dd>
        <dt>Focus</dt><dd id="focus">-</dd>
      </dl>
    </section>
    <section class="card" style="grid-column: 1 / -1">
      <h2>Events</h2>
      <pre id="log"></pre>
    </section>
  </main>
<script>
  const { invoke } = window.__TAURI__.core;
  const appWindow = window.__TAURI__.window.getCurrentWindow();
  const $ = (id) => document.getElementById(id);
  const log = (m) => { $('log').textContent = m + '\n' + $('log').textContent; invoke('log', { msg: m }); };

  const THEMES = {
    light:   { scheme: 'light', tbBg: '#f3f3f3', tbFg: '#1b1b1f', tbMuted: '#8a8a92', bg: '#fafafa', card: '#ffffff', fg: '#1b1b1f', muted: '#6b6b73', accent: '#3b5bdb' },
    dark:    { scheme: 'dark',  tbBg: '#202024', tbFg: '#ececf1', tbMuted: '#7c7c85', bg: '#18181b', card: '#222226', fg: '#ececf1', muted: '#9a9aa3', accent: '#7c93ff' },
    indigo:  { scheme: 'dark',  tbBg: '#3140b8', tbFg: '#ffffff', tbMuted: '#aab3ec', bg: '#f6f7fc', card: '#ffffff', fg: '#1b1b1f', muted: '#6b6b73', accent: '#3140b8' },
    emerald: { scheme: 'dark',  tbBg: '#0f5e56', tbFg: '#f0fdfa', tbMuted: '#8fc7c0', bg: '#f5faf9', card: '#ffffff', fg: '#1b1b1f', muted: '#6b6b73', accent: '#0f766e' },
    sand:    { scheme: 'light', tbBg: '#efe6d8', tbFg: '#3b2f22', tbMuted: '#9c8b76', bg: '#faf7f2', card: '#ffffff', fg: '#3b2f22', muted: '#7d6f5e', accent: '#b4561d' },
  };

  async function applyTheme(name) {
    const t = THEMES[name];
    const s = document.documentElement.style;
    s.setProperty('--tb-bg', t.tbBg); s.setProperty('--tb-fg', t.tbFg); s.setProperty('--tb-muted', t.tbMuted);
    s.setProperty('--tb-hover', t.scheme === 'dark' ? 'rgb(255 255 255 / .1)' : 'rgb(0 0 0 / .06)');
    s.setProperty('--bg', t.bg); s.setProperty('--card', t.card); s.setProperty('--fg', t.fg);
    s.setProperty('--muted', t.muted); s.setProperty('--accent', t.accent);
    s.setProperty('--line', t.fg === '#ececf1' ? 'rgb(255 255 255 / .08)' : 'rgb(0 0 0 / .08)');
    document.querySelectorAll('.swatch').forEach((b) => b.setAttribute('aria-pressed', b.dataset.theme === name));
    await appWindow.setTheme(t.scheme);
    await invoke('set_caption_color', { color: t.tbBg });
    log('theme ' + name);
  }
  for (const [name, t] of Object.entries(THEMES)) {
    const b = document.createElement('button');
    b.className = 'swatch'; b.dataset.theme = name; b.id = 'theme-' + name;
    b.innerHTML = `<i style="background:${t.tbBg}"></i>${name[0].toUpperCase() + name.slice(1)}`;
    b.onclick = () => applyTheme(name);
    $('themes').append(b);
  }

  function reportRects() {
    const r = {};
    for (const id of ['titlebar', 'brand', 'menu-file', 'search', ...Object.keys(THEMES).map((n) => 'theme-' + n)]) {
      const b = $(id).getBoundingClientRect();
      r[id] = [b.left, b.top, b.right, b.bottom].map((v) => Math.round(v * devicePixelRatio));
    }
    invoke('log', { msg: 'rects ' + JSON.stringify(r) });
  }
  async function refreshInsets() {
    const i = await invoke('titlebar_insets');
    document.documentElement.style.setProperty('--tb-top', i.top + 'px');
    document.documentElement.style.setProperty('--tb-h', i.height + 'px');
    document.documentElement.style.setProperty('--tb-right', i.right + 'px');
    $('insets').textContent = `top ${i.top.toFixed(2)}px, height ${i.height.toFixed(2)}px, right ${i.right.toFixed(2)}px`;
    $('dpr').textContent = devicePixelRatio;
    requestAnimationFrame(reportRects);
  }
  addEventListener('resize', refreshInsets);
  addEventListener('focus', () => { document.body.classList.remove('inactive'); $('focus').textContent = 'active'; });
  addEventListener('blur', () => { document.body.classList.add('inactive'); $('focus').textContent = 'inactive'; });
  ['menu-file', 'menu-edit', 'menu-view'].forEach((id) => $(id).onclick = () => log(id + ' clicked'));
  $('search').oninput = (e) => log('search: ' + e.target.value);
  applyTheme('light').then(refreshInsets);
</script>
</body>
</html>
